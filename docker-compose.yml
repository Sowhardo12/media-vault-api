
services:
  postgres:
    image: postgres:15-alpine
    container_name: media_vault_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: media_vault
    ports:
      - '5436:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: